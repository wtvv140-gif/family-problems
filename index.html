GAMES.hoops={start(a){
 const p=G.opts.partner;a.className='garea hoops';
 a.innerHTML='<div class="board"></div><div class="net"></div><div class="rim" id="hRim"></div><div class="ball" id="hBall"></div><div class="power"><div class="zone" id="hZone"></div><div class="needle" id="hNeedle"></div></div>'+(p?'<div class="partner l">'+kidHTML(p,'happy')+'</div>':'')+'<div class="partner r">'+kidHTML(S?S.hero:'adham','calm')+'</div>';
 $('gFoot').innerHTML='<button class="btn" id="hShoot">'+esc(T(GT.hoops.btn))+'</button>';
 let shot=0,made=0,busy=false,z=.5,w=.22,speed=2.2,t=0,lastT=performance.now(),needle=0;
 const newZone=()=>{w=Math.max(.12,.24-shot*.025);z=.2+Math.random()*.6;speed=2.2+shot*.45;$('hZone').style.left=((z-w/2)*100)+'%';$('hZone').style.width=(w*100)+'%';};
 const upd=()=>{gStat('🏀 '+made+'/'+shot);gTime((5-shot)+' ⟳');};
 newZone();upd();
 const frame=now=>{t+=(now-lastT)/1000;lastT=now;if(!busy){needle=(Math.sin(t*speed)+1)/2;$('hNeedle').style.left=(needle*100)+'%';}G.raf=requestAnimationFrame(frame);};G.raf=requestAnimationFrame(frame);
 const shoot=()=>{
  if(busy||G.phase!=='play')return;busy=true;const ok=Math.abs(needle-z)<=w/2;const ball=$('hBall'),rim=$('hRim');
  const dy=(rim.offsetTop+rim.offsetHeight/2)-(ball.offsetTop+ball.offsetHeight/2),side=(needle<z?-1:1)*70;
  const kf=ok?[{transform:'translate(0,0) scale(1)'},{transform:'translate(0,'+(dy-90)+'px) scale(.8)',offset:.55},{transform:'translate(0,'+(dy-14)+'px) scale(.62)',offset:.82},{transform:'translate(0,'+(dy+50)+'px) scale(.6)'}]:[{transform:'translate(0,0) scale(1)'},{transform:'translate('+(side*.6)+'px,'+(dy-80)+'px) scale(.8)',offset:.55},{transform:'translate('+side+'px,'+(dy-10)+'px) scale(.65)',offset:.78},{transform:'translate('+(side*1.8)+'px,'+(dy+120)+'px) scale(.7)'}];
  ball.animate(kf,{duration:820,easing:'ease-out',fill:'forwards'});
  gLater(()=>{shot++;if(ok){made++;sfx.good();}else sfx.miss();const m=document.createElement('div');m.className='shotmsg';m.textContent=T(ok?GT.hoops.swish:GT.hoops.miss);a.append(m);upd();
   gLater(()=>{m.remove();ball.getAnimations().forEach(x=>x.cancel());busy=false;if(shot>=5)gEnd(made,made+'/5',made>=4?3:made>=2?2:1);else newZone();},650);},820);
 };
 $('hShoot').onclick=shoot;$('hShoot').focus();
 G.key=(e,down)=>{if(down&&holdKeyIs(e)&&!e.repeat){e.preventDefault();shoot();return true;}return false;};
}};
/* ---------- THOUGHT CATCHER ---------- */
GAMES.thoughts={start(a){
 a.className='garea thoughts';a.innerHTML='<div class="basket" id="tBasket">🧺</div>';
 const W=()=>a.clientWidth,H=()=>a.clientHeight,bk=$('tBasket');let bx=W()/2,tx=bx,score=0,left=30,bubbles=[],spawnT=0,lastT=performance.now(),el=0,kdir=0;
 const place=()=>{bk.style.left=bx+'px';};place();
 const upd=()=>{gStat('💚 '+score);gTime('⏱ '+Math.ceil(left));};upd();
 const spawn=()=>{const good=Math.random()<.56,list=good?THOUGHTS.good:THOUGHTS.bad,d=document.createElement('div');d.className='tb '+(good?'good':'bad');d.textContent=T(list[Math.floor(Math.random()*list.length)]);a.append(d);const w=d.offsetWidth;const x=10+Math.random()*Math.max(10,W()-w-20);d.style.left=x+'px';d.style.top='-40px';bubbles.push({d,x,y:-40,w,h:d.offsetHeight,good,v:70+el*2.6+Math.random()*30});};
 const pop=(x,y,txt,col)=>{const p=document.createElement('div');p.className='pop';p.style.left=x+'px';p.style.top=y+'px';p.style.color=col;p.textContent=txt;a.append(p);gLater(()=>p.remove(),900);};
 const frame=now=>{const dt=Math.min((now-lastT)/1000,.05);lastT=now;el+=dt;left-=dt;
  if(kdir)tx=bx+kdir*420*dt;bx+= (tx-bx)*Math.min(1,dt*14);bx=Math.max(60,Math.min(W()-60,bx));place();
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.55,1.05-el*.016);}
  const bTop=H()-12-54;
  bubbles=bubbles.filter(b=>{b.y+=b.v*dt;b.d.style.top=b.y+'px';const cx=b.x+b.w/2;
   if(b.y+b.h>=bTop&&b.y<bTop+30&&Math.abs(cx-bx)<60+b.w*.25){b.d.remove();if(b.good){score+=10;sfx.pop();pop(cx,bTop-30,'+10','#5be37a');}else{score=Math.max(0,score-10);sfx.miss();pop(cx,bTop-30,'−10','#ff6b6b');bk.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:240});}upd();return false;}
   if(b.y>H()){b.d.remove();return false;}return true;});
  upd();if(left<=0){bubbles.forEach(b=>b.d.remove());gEnd(score,String(score),score>=150?3:score>=70?2:1);return;}
  G.raf=requestAnimationFrame(frame);};
 G.raf=requestAnimationFrame(frame);
 const onMove=e=>{const r=a.getBoundingClientRect();tx=e.clientX-r.left;};
 a.addEventListener('pointermove',onMove);a.addEventListener('pointerdown',onMove);
 G.cleanup=()=>{a.removeEventListener('pointermove',onMove);a.removeEventListener('pointerdown',onMove);};
 G.key=(e,down)=>{const L=e.code==='ArrowLeft'||e.code==='KeyA',R=e.code==='ArrowRight'||e.code==='KeyD';if(L||R){e.preventDefault();kdir=down?(L?-1:1):0;if(!down)tx=bx;return true;}return false;};
}};
/* ---------- BARISTA RUSH ---------- */
GAMES.barista={start(a){
 const p=G.opts.partner;a.className='garea barista';
 a.innerHTML='<div class="ticket"><div class="tt" id="bT"></div><div class="seq" id="bSeq"></div></div><div class="cup" id="bCup"></div><div class="items" id="bItems"></div>'+(p?'<div class="partner l" style="height:130px;bottom:90px">'+kidHTML(p,'happy')+'</div>':'');
 const items=$('bItems');BARISTA.forEach(ic=>{const b=document.createElement('button');b.textContent=ic;b.disabled=true;b.addEventListener('click',()=>tap(ic));items.append(b);});
 const lens=[2,3,4,5];let r=0,seq=[],inp=[],phase='watch';
 const setBtns=on=>items.querySelectorAll('button').forEach(b=>b.disabled=!on);
 const upd=()=>{gStat('☕ '+r+'/4');gTime('');};
 const round=()=>{upd();phase='watch';inp=[];$('bCup').textContent='';seq=[];for(let i=0;i<lens[r];i++)seq.push(BARISTA[Math.floor(Math.random()*BARISTA.length)]);
  curNPC=p;$('bT').textContent=T(GT.barista.order)+(p?' · '+nameOf(p):'')+' — '+T(GT.barista.watch);curNPC=null;setBtns(false);$('bSeq').textContent='';
  seq.forEach((ic,i)=>gLater(()=>{$('bSeq').textContent+=ic;sfx.pop();},450*(i+1)));
  gLater(()=>{$('bSeq').textContent='❓'.repeat(seq.length);$('bT').textContent=T(GT.barista.your);phase='input';setBtns(true);},450*seq.length+1000+Math.max(0,(lens[r]-2)*250));};
 const tap=ic=>{if(phase!=='input')return;inp.push(ic);$('bCup').textContent=inp.join('');const k=inp.length-1;
  if(ic!==seq[k]){phase='done';setBtns(false);sfx.miss();$('bSeq').textContent=seq.join('');$('bCup').animate([{transform:'translateX(-50%) rotate(-6deg)'},{transform:'translateX(-50%) rotate(6deg)'},{transform:'translateX(-50%)'}],{duration:300});gLater(()=>gEnd(r,r+'/4',r>=4?3:r>=3?2:1),900);return;}
  sfx.pop();if(inp.length===seq.length){phase='done';setBtns(false);r++;sfx.good();upd();if(r>=4)gLater(()=>gEnd(4,'4/4',3),700);else gLater(round,800);}};
 round();
}};
/* ---------- FEELINGS MATCH ---------- */
GAMES.match={start(a){
 a.className='garea match';a.innerHTML='';
 const cards=[];FEEL.forEach((f,i)=>{cards.push({id:i,html:'<span class="em">'+f[0]+'</span>'});cards.push({id:i,html:'<span class="wd">'+esc(T(f[1]))+'</span>'});});shuffle(cards);
 let open=[],moves=0,done=0,lock=false;gStat(T(GT.match.moves)+': 0');gTime('');
 cards.forEach(c=>{const b=document.createElement('button');b.className='mcard';b.innerHTML='<span class="b">?</span><span class="f">'+c.html+'</span>';b.addEventListener('click',()=>{
  if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');sfx.pop();open.push([b,c]);
  if(open.length===2){moves++;gStat(T(GT.match.moves)+': '+moves);const [x,y]=open;open=[];
   if(x[1].id===y[1].id){x[0].classList.add('done');y[0].classList.add('done');sfx.good();done++;if(done===6)gLater(()=>gEnd(moves,String(moves),moves<=8?3:moves<=12?2:1),500);}
   else{lock=true;gLater(()=>{x[0].classList.remove('up');y[0].classList.remove('up');lock=false;},750);}}
 });a.append(b);});
}};
/* ---------- CHAT DEFENDER ---------- */
GAMES.chat={start(a){
 a.className='garea chatg';a.innerHTML='';let left=24,total=0,correct=0,score=0;const live=[];
 const upd=()=>{gStat('🛡️ '+score);gTime('⏱ '+Math.max(0,Math.ceil(left)));};upd();
 const add=()=>{const mean=Math.random()<.55,list=mean?CHATMSG.mean:CHATMSG.kind,m=document.createElement('div');m.className='cm';total++;
  m.innerHTML='<span class="tx">'+esc(T(list[Math.floor(Math.random()*list.length)]))+'</span><button class="rep">'+esc(T(GT.chat.rep))+'</button><button class="lv">'+esc(T(GT.chat.love))+'</button>';
  const o={m,mean,done:false};live.push(o);
  const act=rep=>{if(o.done)return;o.done=true;const ok=rep===mean;m.classList.add(ok?'ok':'no');if(ok){correct++;score+=10;sfx.pop();}else{score=Math.max(0,score-5);sfx.miss();}m.querySelectorAll('button').forEach(b=>b.disabled=true);upd();};
  m.querySelector('.rep').onclick=()=>act(true);m.querySelector('.lv').onclick=()=>act(false);a.append(m);
  while(live.length>6){const x=live.shift();if(!x.done&&x.mean){score=Math.max(0,score-5);}x.m.remove();}upd();};
 add();gEvery(add,1300);gEvery(()=>{left-=.25;upd();if(left<=0){live.forEach(x=>{if(!x.done&&!x.mean)correct++;});const acc=correct/Math.max(1,total);gEnd(score,String(score),acc>=.8?3:acc>=.5?2:1);}},250);
}};
/* ---------- BREATH RHYTHM ---------- */
GAMES.breath={start(a){
 a.className='garea breathg';a.innerHTML='<div class="bacc" id="bAcc"></div><div class="bcircle" id="bC"></div><div class="btext" id="bTx"></div><button class="btn holdbtn" id="bHold">'+esc(T(GT.breath.btn))+'</button>';
 let hold=false,t=-1.2,good=0,tot=0,lastT=performance.now();const C=$('bC'),TX=$('bTx'),HB=$('bHold');
 const setHold=v=>{hold=v;HB.classList.toggle('on',v);};
 HB.addEventListener('pointerdown',e=>{e.preventDefault();try{HB.setPointerCapture(e.pointerId)}catch(_){}setHold(true);});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>HB.addEventListener(n,()=>setHold(false)));
 G.key=(e,down)=>{if(holdKeyIs(e)){e.preventDefault();if(!e.repeat||!down)setHold(down);return true;}return false;};
 gStat('🌬️ 0%');gTime('');
 const frame=now=>{const dt=Math.min((now-lastT)/1000,.05);lastT=now;t+=dt;
  if(t<0){TX.textContent=T(X('GET READY…','استعد…'));C.style.transform='scale(.5)';}
  else{const ph=Math.floor(t/4)%2?'out':'in',p=(t%4)/4,inh=ph==='in';C.style.transform='scale('+(inh?.5+.5*p:1-.5*p)+')';TX.textContent=T(inh?GT.breath.hold:GT.breath.release)+' · '+(4-Math.floor(t%4));
   tot+=dt;if(hold===inh)good+=dt;const acc=Math.round(good/tot*100);$('bAcc').textContent=acc+'%';gStat('🌬️ '+acc+'%');gTime((3-Math.floor(t/8))+' ⟳');
   if(t>=24){const acc2=good/tot;gEnd(Math.round(acc2*100),Math.round(acc2*100)+'%',acc2>=.8?3:acc2>=.55?2:1);return;}}
  G.raf=requestAnimationFrame(frame);};
 G.raf=requestAnimationFrame(frame);HB.focus();
}};
/* ---------- BRAVE TALK BUILDER ---------- */
GAMES.talk={start(a){
 a.className='garea talkg';const order=shuffle([0,1,2]);let si=0,part=0,score=0;gTime('');
 const render=()=>{const q=TALKQ[order[si]];gStat('💬 '+score+'/9');
  a.innerHTML='<div class="sit">'+esc(T(q.s))+'</div><div class="sent" id="tkS"></div><div class="opts" id="tkO"></div>';
  const next=()=>{const opts=shuffle([0,1]),o=$('tkO');o.replaceChildren();opts.forEach(j=>{const b=document.createElement('button');b.textContent=T(q.p[part][j]);b.addEventListener('click',()=>{const span=document.createElement('span');span.className=j===0?'g':'x';span.textContent=T(q.p[part][j]);$('tkS').append(span);if(j===0){score++;sfx.pop();}else sfx.miss();gStat('💬 '+score+'/9');part++;if(part<3)next();else{o.replaceChildren();part=0;si++;gLater(()=>{if(si<3)render();else gEnd(score,score+'/9',score>=9?3:score>=6?2:1);},1100);}});o.append(b);});};
  next();};
 render();
}};

(function(){const d=loadSave();if(d&&d.LANG==='ar')setLang('ar');})();
