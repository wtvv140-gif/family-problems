<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Quest · مغامرة الحياة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Lalezar&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a17;--paper:#fff7e4;--yellow:#ffd23f;--red:#e8433a;--blue:#3f73c0;--sky:#4aa3df;--green:#4caf6e;--purple:#8d5fc4;--pink:#e86fa0;--cap:#f9e3a1;--dir:ltr;
 --display:'Bangers',Impact,'Arial Black',sans-serif;--body:'Comic Neue','Comic Sans MS','Chalkboard SE',system-ui,sans-serif;--ls:1.5px}
html[lang=ar]{--dir:rtl;--display:'Lalezar','Baloo Bhaijaan 2',Tahoma,sans-serif;--body:'Baloo Bhaijaan 2',Tahoma,system-ui,sans-serif;--ls:0}
html[lang=ar] *{letter-spacing:0!important}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:var(--body);font-weight:700;overflow-x:hidden;background:#24206a}
body:before{content:'';position:fixed;inset:-60%;z-index:-2;background:repeating-conic-gradient(from 0deg at 50% 50%,#2d2984 0 6deg,#24206a 6deg 12deg);animation:spin 160s linear infinite}
body:after{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(#ffffff16 1.4px,transparent 1.8px) 0 0/10px 10px}
@keyframes spin{to{transform:rotate(360deg)}}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
[hidden]{display:none!important}
.game{max-width:1180px;margin:auto;padding:12px 18px 24px}

/* ======== comic bits ======== */
.btn{font-family:var(--display);font-size:24px;letter-spacing:2px;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:10px 28px 8px;box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;line-height:1.15}
html[lang=ar] .btn{padding:8px 26px 10px}
@media(hover:hover){.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{background:#b9b3a4;cursor:default;opacity:.85}
.btn.ghost{background:#fff}
.link{background:none;color:#fff;text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:6px}
.cap{display:inline-block;background:var(--cap);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 12px 5px;font-family:var(--display);letter-spacing:1.2px;font-size:18px;line-height:1.15}
.tape{display:inline-block;background:linear-gradient(#f4ecd3,#e7dcbc);color:var(--ink);font-family:var(--display);letter-spacing:1.6px;font-size:15px;line-height:1.1;padding:5px 14px 4px;white-space:nowrap;clip-path:polygon(0 0,100% 0,96% 25%,100% 50%,96% 75%,100% 100%,0 100%,4% 75%,0 50%,4% 25%);transform:rotate(-3deg)}
.small{font-size:12px;color:#d9d5f2;margin:6px 0}
.credit{display:table;margin:0 auto 10px;background:var(--cap);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 #0c0a2c;padding:7px 16px 6px;font-size:15px;transform:rotate(-1deg)}
.credit b{font-family:var(--display);font-weight:400;letter-spacing:1.5px;font-size:19px;color:var(--red)}
.credit-m{display:none}

/* ======== HUD ======== */
.hud{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:30px;letter-spacing:2px;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--red),5px 5px 0 var(--ink);transform:rotate(-2deg);margin-inline-end:auto;line-height:1.1}
.meter{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:30px;padding:5px 12px 5px 8px}
.meter .ml{font-family:var(--display);letter-spacing:1px;font-size:16px;white-space:nowrap;line-height:1}
.meter .bar{width:110px;height:14px;border:2.5px solid var(--ink);border-radius:10px;background:#ece6d6;overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;transition:width .7s cubic-bezier(.3,1.4,.5,1);background:repeating-linear-gradient(-45deg,var(--c) 0 8px,var(--c2) 8px 16px)}
.meter.mood{--c:#ff8fa3;--c2:#ff7088}.meter.bond{--c:#ffd86b;--c2:#f6c443}
.meter .mv{font-family:var(--display);font-size:17px;min-width:26px;text-align:center}
.float{position:absolute;top:-6px;inset-inline-end:8px;font-family:var(--display);font-size:22px;-webkit-text-stroke:1px var(--ink);pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:5}
.float.up{color:#5be37a}.float.down{color:#ff6b6b}
@keyframes floatUp{from{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-14px) scale(1.15);opacity:1}to{transform:translateY(-38px);opacity:0}}
.hrs{display:flex;gap:2px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:10px;padding:4px 8px;font-size:18px;line-height:1.2}
.hrs span.used{filter:grayscale(1);opacity:.3}
.tools{display:flex;gap:5px}
.tool{width:36px;height:36px;display:grid;place-items:center;font-size:18px;background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);border-radius:9px;filter:grayscale(1);opacity:.45;transition:.3s}
.tool.on{filter:none;opacity:1;background:var(--yellow)}
.badge{font-family:var(--display);font-size:18px;letter-spacing:1px;background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 11px 3px;border-radius:10px;white-space:nowrap}
.badge.day{background:#fff}
.icon-btn{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);min-width:44px;height:40px;border-radius:10px;font-size:17px;padding:0 8px}
.icon-btn.lang{font-family:'Lalezar','Bangers',sans-serif;font-size:19px}
html[lang=ar] .icon-btn.lang{font-family:'Bangers',sans-serif;font-size:18px;letter-spacing:1px}
.icon-btn.phone{background:var(--yellow);font-size:20px;position:relative}
.icon-btn.phone .dot{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--red);border:2.5px solid var(--ink);font-size:10px;color:#fff;display:grid;place-items:center}

/* ======== Stage / world ======== */
.stage{position:relative;height:min(72vh,620px);min-height:540px;overflow:hidden;border:6px solid var(--ink);border-radius:6px;box-shadow:10px 10px 0 #0c0a2c;user-select:none;-webkit-user-select:none;touch-action:manipulation;direction:ltr;--s1:#8fd3f5;--s2:#fff2c8;--dark:0;--starO:0;--glow:0;--sunX:12%;--sunY:16%;--sunC:#ffe066;--city:#9fb7d9}
.stage.t-noon{--s1:#4fb0ee;--s2:#c8ecff;--sunX:48%;--sunY:8%;--city:#8fb0d6}
.stage.t-afternoon{--s1:#5ea8e6;--s2:#ffe3b0;--sunX:66%;--sunY:14%;--city:#9aa7cf}
.stage.t-sunset{--s1:#5a4fa8;--s2:#ff9a6b;--sunX:84%;--sunY:36%;--sunC:#ff8a3d;--city:#6b5a9e;--dark:.16;--glow:.6}
.stage.t-night{--s1:#120f36;--s2:#2d2a6e;--sunX:82%;--sunY:12%;--sunC:#f4f1d0;--city:#2c2a5c;--dark:.4;--starO:1;--glow:1}
.sky{position:absolute;inset:0;background:linear-gradient(var(--s1),var(--s2));transition:background 1.2s}
.stars{position:absolute;inset:0 0 40% 0;opacity:var(--starO);transition:opacity 1.2s;background:radial-gradient(#fff 1.2px,transparent 1.8px) 0 0/53px 41px,radial-gradient(#fff 1px,transparent 1.6px) 20px 13px/71px 59px}
.sun{position:absolute;left:var(--sunX);top:var(--sunY);width:66px;height:66px;border-radius:50%;background:var(--sunC);border:4px solid var(--ink);box-shadow:0 0 0 10px #ffffff33,0 0 40px var(--sunC);transition:left 1.4s,top 1.4s,background 1.2s}
.t-night .sun{box-shadow:inset -14px -6px 0 #d8d3a8,0 0 30px #fff6}
.cloud{position:absolute;width:90px;height:30px;background:#fff;border:3px solid var(--ink);border-radius:30px;animation:drift 50s linear infinite;opacity:.95}
.cloud:before{content:'';position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid var(--ink);border-bottom-color:transparent;border-right-color:transparent;transform:rotate(45deg);left:18px;top:-24px}
.cloud.c1{top:12%;left:-20%}.cloud.c2{top:26%;left:-20%;animation-duration:70s;animation-delay:-35s;transform:scale(.75)}
.t-night .cloud,.t-sunset .cloud{opacity:.35}
@keyframes drift{to{left:110%}}
.skyline{position:absolute;left:0;bottom:21%;height:36%;color:var(--city);transition:color 1.2s;z-index:0}
.skyline svg{height:100%;width:100%;display:block}
.world{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.sidewalk{position:absolute;left:0;right:0;bottom:9%;height:13%;background:repeating-linear-gradient(90deg,#d9d2c0 0 78px,#1d1a1755 78px 81px),#d9d2c0;border-top:5px solid var(--ink);z-index:1}
.road{position:absolute;left:0;right:0;bottom:0;height:9%;background:#4a4a58;border-top:5px solid #8a8a96;z-index:1}
.road:after{content:'';position:absolute;left:0;right:0;top:45%;height:5px;background:repeating-linear-gradient(90deg,#ffd23f 0 46px,transparent 46px 92px)}
.stage.indoor .sky,.stage.indoor .skyline{display:none}
.iwall{position:absolute;left:0;right:0;top:0;height:82%;background:radial-gradient(#0000001a 1.2px,transparent 1.6px) 0 0/9px 9px,repeating-linear-gradient(90deg,#f6d891 0 34px,#f0cd7e 34px 68px)}
.iwall:after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;background:repeating-linear-gradient(90deg,#c98a4f 0 96px,#a9692f 96px 100px);border-top:8px solid #8a5a33;box-shadow:0 -4px 0 var(--ink)}
.ifloor{position:absolute;left:0;right:0;bottom:0;height:18%;background:repeating-linear-gradient(90deg,#c38b55 0 120px,#1d1a1750 120px 123px),linear-gradient(#b67c46,#97602f);border-top:5px solid var(--ink)}
.shade{position:absolute;inset:0;background:#1d1b52;opacity:var(--dark);pointer-events:none;z-index:5;transition:opacity 1.2s}
.stage.indoor .shade{opacity:calc(var(--dark)*.4)}
.obj{position:absolute;bottom:21.5%;transform:translateX(-50%);z-index:2}
.stage.indoor .obj{bottom:17.5%}
.obj.wall{bottom:auto}
.obj>svg{height:100%;width:100%;display:block}
.obj.oact{cursor:pointer}
.osign{position:absolute;left:50%;top:-12%;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;font-size:18px;z-index:3}
.stage.indoor .osign{top:-14%}
.oicon{position:absolute;left:50%;top:-30%;transform:translateX(-50%);font-size:26px;z-index:3;animation:bobm 1s ease-in-out infinite alternate;filter:drop-shadow(2px 2px 0 var(--ink))}
.omark{position:absolute;left:50%;top:-38%;transform:translateX(-50%);width:58px;height:58px;display:grid;place-items:center;z-index:4;animation:bobm .7s ease-in-out infinite alternate}
.omark svg{position:absolute;inset:0;width:100%;height:100%}
.omark b{position:relative;font-family:var(--display);font-size:30px;font-weight:400}
@keyframes bobm{to{transform:translate(-50%,-8px)}}
.lamp{position:absolute;bottom:21.5%;height:44%;aspect-ratio:60/260;transform:translateX(-50%);z-index:1}
.lamp svg{height:100%;width:100%;display:block}
.lampglow{position:absolute;bottom:50%;height:34%;aspect-ratio:1;transform:translateX(-42%);background:radial-gradient(#fff3a6aa,transparent 65%);opacity:var(--glow);z-index:6;pointer-events:none;transition:opacity 1.2s}
.exit{position:absolute;bottom:21.5%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.stage.indoor .exit{bottom:17.5%}
.exit .arrowsign{background:#3f73c0;color:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 var(--ink);padding:5px 10px 3px;font-family:var(--display);letter-spacing:var(--ls);font-size:17px;white-space:nowrap;animation:nudge 1s ease-in-out infinite alternate}
.exit .pole{width:8px;height:60px;background:#8a5a33;border:3px solid var(--ink);border-top:0}
@keyframes nudge{to{transform:translateX(5px)}}
.exit.left .arrowsign{animation-name:nudgeL}
@keyframes nudgeL{to{transform:translateX(-5px)}}
.cstar{position:absolute;bottom:30%;transform:translateX(-50%);font-size:34px;z-index:4;animation:twinkleS 1.2s ease-in-out infinite alternate;filter:drop-shadow(2px 2px 0 var(--ink));pointer-events:none}
.stage.indoor .cstar{bottom:26%}
@keyframes twinkleS{to{transform:translateX(-50%) translateY(-10px) scale(1.15) rotate(12deg)}}
.cstar.got{animation:gotS .6s forwards}
@keyframes gotS{to{transform:translateX(-50%) translateY(-90px) scale(1.8);opacity:0}}

.quest{position:absolute;inset-inline-start:14px;top:14px;z-index:8;max-width:50%;background:var(--cap);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:7px 11px;font-size:13px;line-height:1.35;direction:var(--dir)}
.quest b{display:block;font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:15px;color:var(--red)}
.quest span{display:block}
.areatag{position:absolute;inset-inline-end:14px;top:14px;z-index:8;font-family:var(--display);font-size:17px;letter-spacing:1px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:5px 10px 3px;border-radius:8px;direction:var(--dir)}

/* actors */
.actor{position:absolute;bottom:13%;height:38%;aspect-ratio:var(--ar,.36);transform:translateX(-50%);z-index:7}
.stage.indoor .actor{bottom:10%;height:42%}
.actor.npc{z-index:6;cursor:pointer}
.kw{position:relative;height:100%;transform-origin:50% 100%}
.kw img,.kw .face{position:absolute;inset:0;width:100%;height:100%;display:block}
.actor .kw{animation:breathe 3s ease-in-out infinite}
.actor.npc .kw{animation-delay:-1.3s}
.actor.walking .kw{animation:waddle .3s ease-in-out infinite alternate}
.actor .inner{height:100%;width:100%}
.actor.flip .inner{transform:scaleX(-1)}
@keyframes waddle{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-7px)}}
@keyframes breathe{50%{transform:scaleY(1.012)}}
.actor .shadow{position:absolute;left:50%;bottom:-3%;width:110%;height:7%;transform:translateX(-50%);background:#1d1a1740;border-radius:50%;z-index:-1}
.actor>.tape{position:absolute;left:50%;bottom:-9%;transform:translateX(-50%) rotate(-3deg);z-index:2;font-size:14px}
.you-mark{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--yellow);border:3px solid var(--ink);border-radius:20px;padding:3px 10px 1px;font-family:var(--display);letter-spacing:var(--ls);font-size:15px;box-shadow:2px 2px 0 var(--ink);animation:bob 1s ease-in-out infinite alternate;white-space:nowrap}
.you-mark:after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink)}
@keyframes bob{to{transform:translate(-50%,-6px)}}
.npcmark{position:absolute;left:50%;top:-50px;transform:translateX(-50%);width:50px;height:50px;display:grid;place-items:center;animation:bobm .7s ease-in-out infinite alternate}
.npcmark svg{position:absolute;inset:0;width:100%;height:100%}
.npcmark b{position:relative;font-family:var(--display);font-size:28px;font-weight:400;color:#fff;-webkit-text-stroke:1.3px var(--ink)}
.npcchat{position:absolute;left:50%;top:-36px;transform:translateX(-50%);font-size:24px;filter:drop-shadow(2px 2px 0 var(--ink));animation:bobm 1.1s ease-in-out infinite alternate}
.pbubble{position:absolute;left:50%;bottom:calc(100% + 40px);transform:translateX(-50%);width:max-content;max-width:210px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 11px;font-size:13px;line-height:1.3;box-shadow:3px 3px 0 var(--ink);direction:var(--dir);text-align:center;z-index:9}

/* action button (FIXED: wrapper does the centering, the button keeps its own hover/active transforms) */
.actwrap{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;pointer-events:none;z-index:9}
.act{pointer-events:auto;font-size:22px;background:var(--red);color:#fff;-webkit-text-stroke:.8px var(--ink);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:var(--dir)}
.act.closed{background:#9aa3ad}
.act.pulse{animation:glowb .8s ease-in-out infinite alternate}
@keyframes glowb{to{box-shadow:5px 5px 0 var(--ink),0 0 0 8px #ffd23f88}}

/* toast + memory note */
.toast{position:absolute;top:30%;left:50%;width:210px;height:140px;margin-left:-105px;z-index:60;pointer-events:none;display:grid;place-items:center;animation:toastIn .35s cubic-bezier(.3,1.6,.5,1)}
.toast svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(4px 4px 0 var(--ink))}
.toast span{position:relative;font-family:var(--display);font-size:26px;letter-spacing:var(--ls);color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg);text-align:center;line-height:1.05;max-width:160px}
@keyframes toastIn{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.memo{position:absolute;inset-inline-start:16px;bottom:80px;z-index:70;background:#1d1a17;color:#fff;border:3px solid #fff;border-radius:10px;padding:8px 14px;font-size:14px;box-shadow:4px 4px 0 #0008;direction:var(--dir);animation:memoIn .4s ease-out;pointer-events:none;max-width:70%}
.memo:before{content:'🧠 ';}
@keyframes memoIn{from{transform:translateY(20px);opacity:0}}
.fader{position:absolute;inset:0;background:#1d1a17;opacity:0;pointer-events:none;z-index:95;transition:opacity .22s}
.fader.on{opacity:1}

/* controls */
.controls{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:16px}
.controls p{font-size:13px;color:#e6e2ff;line-height:1.55;margin:0}
.controls b{font-family:var(--display);font-weight:400;letter-spacing:var(--ls);color:var(--yellow)}
.arrows{display:flex;gap:10px;align-items:center}
.arrows button{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:60px;height:48px;border-radius:10px;font-size:22px;touch-action:none}
.arrows button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.arrows .calm-btn{width:auto;padding:0 14px;font-size:14px;background:#a7e3d6}
footer{text-align:center;font-size:11px;color:#bdb8e6;margin-top:16px}

/* ======== overlays ======== */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;overscroll-behavior:contain;direction:var(--dir);background:radial-gradient(#ffffff12 1.4px,transparent 1.8px) 0 0/10px 10px,repeating-conic-gradient(from 0deg at 50% 40%,#2f2b8c 0 7deg,#24206a 7deg 14deg);background-color:#24206a}
.overlay.dim{background:#1d1a17cc}
.overlay>*{position:relative}
.panelwrap{margin:auto;text-align:center;width:100%}
.paper{background:var(--paper);border:5px solid var(--ink);box-shadow:10px 10px 0 var(--ink);border-radius:10px;padding:16px 18px}
.logo-big{font-family:var(--display);font-size:clamp(46px,6.4vw,76px);letter-spacing:3px;line-height:.92;color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink);transform:rotate(-3deg);margin:4px 0 14px}
html[lang=ar] .logo-big{line-height:1.2;font-size:clamp(40px,5.6vw,64px)}
.logo-big span{display:block}
.logo-big span+span{color:#fff;margin-inline-start:.6em}
.tagline{transform:rotate(1.5deg);margin-bottom:12px}
.lineup{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:4px;height:130px;margin:6px auto 4px;padding-top:12px;direction:ltr}
.lineup:before{content:'';position:absolute;left:8%;right:8%;bottom:0;height:20px;background:#e2c48c;border:3px solid var(--ink);border-radius:50%;z-index:0}
.mate-fig{position:relative;height:108px;z-index:1;animation:jump .6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.1s)}
.mate-fig.me{height:124px;z-index:2}
.mate-fig.me:before{content:'★';position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:26px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);z-index:3}
.mate-fig.adult{height:124px}
.mate-fig.adult svg{height:100%;width:auto;display:block}
@keyframes jump{to{transform:translateY(-10px)}}
.langpick{display:flex;justify-content:center;gap:10px;margin:12px 0 6px}
.langpick button{font-size:18px;padding:6px 16px 4px;border-radius:10px;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink)}
.langpick button[aria-pressed=true]{background:var(--yellow)}
.langpick .ar{font-family:'Lalezar',sans-serif;font-size:19px}
.langpick .en{font-family:'Bangers',sans-serif;letter-spacing:1.5px}
.sub{color:#e6e2ff;font-size:14px;margin:8px 0 2px}
.startbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* quiz / result / select */
.quiz{max-width:760px}
.qprog{font-family:var(--display);letter-spacing:3px;color:var(--yellow);font-size:20px}
.qdots{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}
.qdots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.qdots i.on{background:var(--yellow)}.qdots i.cur{background:var(--red);transform:scale(1.2)}
.qtitle{font-family:var(--display);font-weight:400;letter-spacing:2px;font-size:clamp(28px,4.4vw,44px);color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:6px 0 18px;line-height:1.15;transform:rotate(-1deg)}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qopts button{background:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:14px;padding:14px 16px;font-size:16px;text-align:start;line-height:1.3;transition:transform .12s,box-shadow .12s,background .15s}
@media(hover:hover){.qopts button:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:7px 7px 0 var(--ink);background:#fff4cf}}
.qopts button.picked{background:var(--yellow);transform:scale(1.04) rotate(-1deg)}
.qopts.emoji{grid-template-columns:repeat(3,1fr)}
.qopts.emoji button{font-size:52px;text-align:center;padding:12px}
.result{max-width:780px;display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;text-align:start}
.res-hero{position:relative;height:330px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;border:4px solid var(--ink);border-radius:8px;background:var(--c)}
.res-hero:before{content:'';position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffffff40 0 8deg,transparent 8deg 16deg);animation:spinc 30s linear infinite}
@keyframes spinc{to{transform:translate(-50%,-50%) rotate(360deg)}}
.res-hero .kw{height:92%;position:relative;z-index:1;animation:toastIn .5s cubic-bezier(.3,1.6,.5,1)}
.res-name{font-family:var(--display);font-size:clamp(48px,7vw,72px);letter-spacing:3px;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);line-height:1.05;margin:8px 0 6px}
.result .tape{font-size:20px}
.res-desc{font-size:16px;line-height:1.5;margin:14px 0 16px}
.result .link,.paper .link{color:var(--blue)}
.select{max-width:880px}
.select h2{font-family:var(--display);font-weight:400;letter-spacing:3px;font-size:40px;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;max-width:840px;margin:0 auto}
.card{position:relative;height:205px;overflow:hidden;border:4px solid var(--ink);border-radius:8px;background:var(--c);box-shadow:5px 5px 0 var(--ink);padding:0;transition:transform .15s,box-shadow .15s}
.card:before{content:'';position:absolute;inset:0;background:radial-gradient(#ffffff38 1.6px,transparent 2px) 0 0/9px 9px}
.card .kw{position:absolute;left:50%;top:12px;height:318px;transform:translateX(-50%);pointer-events:none}
.card .tape{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) rotate(-3deg);font-size:17px;z-index:2}
@media(hover:hover){.card:hover{transform:translateY(-4px) rotate(-1deg)}}
.card[aria-pressed=true]{transform:rotate(-2deg) scale(1.05);box-shadow:0 0 0 5px var(--yellow),9px 9px 0 var(--ink);z-index:2}
.picked{margin:18px auto 14px;min-height:24px;color:#fff;font-size:16px}
.picked b{font-family:var(--display);font-weight:400;letter-spacing:var(--ls);color:var(--yellow);font-size:22px}
.intro{max-width:840px}
.intro .panel{--fh:180px}
.narr{background:var(--cap);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;margin:14px auto;max-width:700px;font-size:15px;line-height:1.55;text-align:start;transform:rotate(-.6deg)}

/* time card */
.timecard{max-width:620px}
.tc-day{font-family:var(--display);font-size:clamp(56px,9vw,96px);letter-spacing:4px;color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--red),9px 9px 0 var(--ink);line-height:1;transform:rotate(-3deg);animation:toastIn .5s cubic-bezier(.3,1.6,.5,1)}
.tc-part{font-family:var(--display);font-size:34px;letter-spacing:3px;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);margin:8px 0}
.tc-sub{color:#e6e2ff;font-size:16px;margin:8px 0 14px}
.missed{background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;margin:0 auto 16px;max-width:520px;text-align:start}
.missed h4{margin:0 0 6px;font-family:var(--display);font-weight:400;letter-spacing:var(--ls);color:var(--red);font-size:19px}
.missed div{font-size:14px;line-height:1.5}

/* phone */
.phone-ov{z-index:45}
.phonebox{width:min(460px,100%);background:#2b2b36;border:5px solid var(--ink);border-radius:34px;box-shadow:10px 10px 0 #0c0a2c;padding:18px 14px 16px;margin:auto}
.phonebox .notch{width:90px;height:10px;border-radius:6px;background:#555;margin:0 auto 12px}
.pscreen{background:var(--paper);border:3px solid var(--ink);border-radius:18px;min-height:420px;max-height:min(66vh,520px);overflow:auto;padding:12px;text-align:start}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.ptabs button{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px 4px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.ptabs button[aria-pressed=true]{background:var(--yellow)}
.pclose{position:absolute;top:8px;inset-inline-end:10px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:50%;width:38px;height:38px;font-size:18px;box-shadow:2px 2px 0 var(--ink);z-index:2}
.bondcard{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;margin-bottom:8px;box-shadow:3px 3px 0 var(--ink)}
.av{width:50px;height:50px;border-radius:50%;overflow:hidden;border:3px solid var(--ink);background-color:var(--c,#bfe3f2);background-repeat:no-repeat}
.bondcard b{font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:18px}
.bondcard .st{font-size:12px;color:#6b6458}
.bbar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#ece6d6;overflow:hidden;margin:4px 0}
.bbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffd86b 0 8px,#f6c443 8px 16px)}
.arcdots{display:flex;gap:4px;align-items:center;font-size:12px}
.arcdots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.arcdots i.great{background:#ffd23f}.arcdots i.good{background:#5be37a}.arcdots i.mid{background:#ffe38a}.arcdots i.bad{background:#ff8a65}.arcdots i.missed{background:#9aa3ad}
.mapgrid{display:grid;gap:8px}
.mapbtn{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:3px 3px 0 var(--ink);text-align:start;font-size:15px}
.mapbtn .mi{font-size:28px}
.mapbtn .who{font-size:12px;color:#6b6458;display:block}
.mapbtn.here{background:#fff4cf}
.mapbtn b{font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:19px}
.toolrow{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:3px 3px 0 var(--ink)}
.toolrow b{font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:19px}
.toolrow.off{opacity:.6}
.storyrow{font-size:13px;line-height:1.45;border-inline-start:6px solid var(--c,#7fc8f8);background:#fff;border-radius:8px;padding:6px 10px;margin-bottom:6px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);border-inline-end:2px solid var(--ink)}
.endpart{width:100%;margin-top:12px;font-size:17px;background:#ff9fb2}

/* confirm */
.confirm{max-width:420px}
.confirm p{font-size:16px;line-height:1.5}
.confirm .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* end */
.end-panel{max-width:760px;padding:14px 20px 12px}
.end-panel .cap{transform:rotate(-2deg);font-size:20px}
.stars3{font-size:44px;letter-spacing:8px;margin-top:14px;line-height:1}
.stars3 span{display:inline-block;color:#d8d2c2;-webkit-text-stroke:2px var(--ink);animation:starIn .5s both}
.stars3 span.on{color:var(--yellow)}
.stars3 span:nth-child(2){animation-delay:.25s}.stars3 span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}}
.end-title{font-family:var(--display);font-weight:400;letter-spacing:3px;font-size:clamp(36px,6vw,54px);margin:4px 0;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);line-height:1.1}
.end-text{font-size:16px;line-height:1.5;margin:6px auto;max-width:560px}
.says{display:grid;gap:8px;margin:10px auto;max-width:620px;text-align:start}
.sayrow{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;background:#fff;border:3px solid var(--ink);border-inline-start-width:9px;border-inline-start-color:var(--c);border-radius:12px;padding:7px 10px;font-size:14px;line-height:1.4}
.sayrow b{display:block;font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:16px}
.safety{background:#e6f5ff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.45;margin:10px auto;max-width:560px}
.end-panel .small{color:#6b6458;margin:4px 0}
details{margin:6px auto;max-width:620px;text-align:start}
summary{cursor:pointer;font-family:var(--display);letter-spacing:var(--ls);font-size:20px;text-align:center;padding:6px;color:var(--blue)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-20px;width:10px;height:15px;border:2px solid var(--ink);border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(620deg)}}
.endlang{position:absolute;top:12px;inset-inline-end:12px;z-index:6}

/* ======== comic panel ======== */
.panel{position:relative;overflow:hidden;display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--ink);background:linear-gradient(var(--wall,#dfe6d8) 0 77%,var(--floor,#c9a477) 77%);--fh:230px;min-height:0;direction:ltr}
.panel.night{--floor:#5a4f7a}
.panel:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(#0000001c 1.2px,transparent 1.6px) 0 0/8px 8px;z-index:1}
.panel .floorline{position:absolute;left:0;right:0;top:77%;border-top:4px solid var(--ink)}
.panel .moonp{position:absolute;right:8%;top:18%;width:46px;height:46px;border-radius:50%;background:#f4f1d0;border:3px solid var(--ink);box-shadow:inset -10px -4px 0 #d8d3a8;z-index:0}
.rays{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s;pointer-events:none}
.rays.angry{opacity:1;background:repeating-conic-gradient(#e8433a30 0 8deg,transparent 8deg 16deg)}
.rays.gloom{opacity:1;background:repeating-conic-gradient(#3f4fa838 0 8deg,transparent 8deg 16deg)}
.rays.win{opacity:1;background:repeating-conic-gradient(#ffd23f70 0 8deg,transparent 8deg 16deg);animation:spinc 30s linear infinite}
.prop{position:absolute;left:50%;bottom:6%;width:42%;max-width:250px;transform:translateX(-50%);z-index:0;opacity:.95}
.prop svg{width:100%;height:auto;display:block}
.phead{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 10px 0;direction:var(--dir)}
.phead .cap{transform:rotate(-1deg);text-align:start}
.phead .cap small{display:block;font-family:var(--body);font-weight:700;letter-spacing:1px;font-size:11px;margin-top:3px;color:#6b4d23}
.sfx{position:relative;flex:0 0 auto;width:118px;height:80px;display:grid;place-items:center;transform:rotate(8deg);margin:-4px -2px 0 0}
.sfx svg{position:absolute;inset:0;width:100%;height:100%}
.sfx span{position:relative;font-family:var(--display);font-size:24px;letter-spacing:1px;color:var(--c);-webkit-text-stroke:1.2px var(--ink);text-shadow:2px 2px 0 var(--ink);line-height:.95;text-align:center;max-width:100px}
html[lang=ar] .sfx span{font-size:22px;line-height:1.2}
.sfx.boom{animation:boom .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes boom{from{transform:scale(.2) rotate(-30deg)}}
.prow{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;justify-content:space-around;gap:6px;padding:4px 8px 6px;min-height:0;direction:var(--dir)}
.slot{flex:1 1 0;min-width:0;max-width:280px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.fig{position:relative;height:var(--fh);display:flex;align-items:flex-end;justify-content:center}
.fig.adult{height:calc(var(--fh)*1.12)}
.fig.teen{height:calc(var(--fh)*.98)}
.fig>svg{height:100%;width:auto;display:block;max-width:100%}
.fig.phone{height:calc(var(--fh)*.58);margin-bottom:calc(var(--fh)*.28);transform:rotate(-7deg)}
.fig.shake{animation:shake .25s linear infinite alternate}
@keyframes shake{from{transform:translateX(-1.5px) rotate(-.6deg)}to{transform:translateX(1.5px) rotate(.6deg)}}
.slot.hero .kw{transform:scaleX(-1)}
html[lang=ar] .slot.hero .kw{transform:none}
.is-win .fig.kid,.is-win .fig.adult{animation:hop .5s ease-out}
@keyframes hop{40%{transform:translateY(-12px)}}
.ema{position:absolute;top:-4%;right:-6%;width:36%;max-width:52px;z-index:3}
.ema svg{width:100%;height:auto}
.ema-sad{right:auto;left:50%;transform:translateX(-50%);top:-14%;width:52%;max-width:70px;animation:bob2 1.4s ease-in-out infinite alternate}
.ema-happy{animation:twinkle .7s ease-in-out infinite alternate}
@keyframes bob2{to{transform:translate(-50%,-4px)}}
@keyframes twinkle{to{transform:scale(1.18) rotate(10deg)}}
.slot>.tape{margin-top:-10px;position:relative;z-index:4;font-size:14px}
.bubble{position:relative;z-index:4;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 11px;font-size:14px;line-height:1.3;margin-bottom:16px;box-shadow:3px 3px 0 #1d1a1730;max-width:100%;text-align:center;direction:var(--dir)}
.bubble.say:before{content:'';position:absolute;left:30%;bottom:-16px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:16px solid var(--ink)}
.bubble.say:after{content:'';position:absolute;left:calc(30% + 3px);bottom:-10px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:11px solid #fff}
.bubble.think{border-radius:30px;background:#fffef6;color:#3c4652}
.bubble.think:before{content:'';position:absolute;right:30%;bottom:-13px;width:13px;height:13px;border-radius:50%;background:#fffef6;border:3px solid var(--ink)}
.bubble.think:after{content:'';position:absolute;right:24%;bottom:-24px;width:8px;height:8px;border-radius:50%;background:#fffef6;border:2.5px solid var(--ink)}
.bubble.post{background:#e8f3ff;border-radius:12px;font-size:13px;transform:rotate(-2deg)}
.bubble.post:before{content:'';position:absolute;left:24%;bottom:-14px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid var(--ink)}
.bubble.post:after{content:'';position:absolute;left:calc(24% + 3px);bottom:-8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:9px solid #e8f3ff}
.is-win .bubble.think{background:#dcf5df;color:#1f5a2c}
.is-win .bubble.think:before,.is-win .bubble.think:after{background:#dcf5df}
.bubble-spacer{height:10px}

/* ======== scene card ======== */
.dialogue{position:absolute;inset:12px;z-index:15;background:var(--paper);border:5px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 var(--ink);padding:12px 16px 16px;display:grid;grid-template-columns:1.12fr 1fr;grid-template-rows:auto 1fr;gap:12px 18px;overflow:auto;overscroll-behavior:contain;direction:var(--dir)}
.dialogue:before{content:'';position:absolute;inset:0;background:radial-gradient(#d9c9a333 1.4px,transparent 1.8px) 0 0/10px 10px;pointer-events:none}
.dialogue>*{position:relative}
.dialogue.fade .q-scene,.dialogue.fade .decision{animation:slideIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(18px) rotate(-1deg)}}
.dlg-top{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{font-family:var(--display);letter-spacing:var(--ls);font-size:18px;background:var(--red);color:#fff;-webkit-text-stroke:.6px var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 12px 2px;transform:rotate(-1deg);margin-inline-end:auto}
.step.arc{background:var(--c)}
.read{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:9px;padding:6px 11px;font-size:13px;white-space:nowrap}
.notnow{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:9px;padding:6px 11px;font-size:13px;white-space:nowrap}
.q-scene{grid-column:1;grid-row:2;min-height:420px}
.decision{grid-column:2;grid-row:2;align-self:center;padding-inline-end:6px}
.prev{background:#1d1a17;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.4;margin-bottom:10px;transform:rotate(-.5deg)}
.prev:before{content:'⟲ ';color:var(--yellow)}
.asks{display:flex;align-items:center;gap:10px;font-family:var(--display);letter-spacing:var(--ls);font-size:20px;color:var(--blue)}
.choices{display:grid;gap:9px;margin-top:10px}
.choices button{display:flex;gap:10px;align-items:center;text-align:start;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;font:700 15px/1.3 var(--body);box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .15s}
.choices .arrow{flex:0 0 30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:13px;background:var(--k)}
html[lang=ar] .choices .arrow{transform:scaleX(-1)}
@media(hover:hover){.choices button:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:#fff4cf}}
.choices button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.choices button.toolopt{background:#fffbe0;border-style:dashed}
.choices button.gameopt{background:#eef8ff}
.choices .chip{display:inline-block;font-family:var(--display);letter-spacing:var(--ls);font-size:13px;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:1px 7px 0;margin-inline-end:6px}
.choices button:disabled{cursor:not-allowed;opacity:.55;box-shadow:2px 2px 0 var(--ink);background:#eee}
.choices button:disabled .chip{background:#ccc}
.choices button.chosen,.choices button.chosen:disabled{background:#fff4cf;transform:rotate(-.6deg);box-shadow:5px 5px 0 var(--ink);opacity:1;cursor:default}
.res{margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;box-shadow:4px 4px 0 var(--ink)}
.res h3{margin:0 0 6px;font-family:var(--display);font-weight:400;letter-spacing:var(--ls);font-size:20px;color:var(--red)}
.res p{margin:0;font-size:15px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips span{font-family:var(--display);letter-spacing:1px;font-size:17px;border:3px solid var(--ink);border-radius:20px;padding:3px 12px 1px;box-shadow:2px 2px 0 var(--ink);animation:toastIn .4s cubic-bezier(.3,1.6,.5,1) both}
.chips .up{background:#c9f5d2}.chips .down{background:#ffd3cc}.chips .zero{background:#eee}.chips .tl{background:var(--yellow)}
.chips span:nth-child(2){animation-delay:.12s}.chips span:nth-child(3){animation-delay:.24s}
.next{width:100%;margin-top:12px;font-size:22px}
.optlist{display:grid;gap:9px;margin-top:12px}
.optlist button{display:flex;gap:10px;align-items:center;text-align:start;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font:700 15px/1.3 var(--body);box-shadow:4px 4px 0 var(--ink)}
.optlist button:disabled{opacity:.5;cursor:default}
.optlist button .ok{margin-inline-start:auto;color:#2f8a45}

/* ======== mini-games ======== */
.game-ov{z-index:50}
.gbox{width:min(760px,100%);background:var(--paper);border:5px solid var(--ink);box-shadow:10px 10px 0 var(--ink);border-radius:12px;padding:12px 14px 14px;margin:auto}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ghead .cap{font-size:20px;margin-inline-end:auto}
.gstat{font-family:var(--display);font-size:20px;letter-spacing:1px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:3px 10px 1px;box-shadow:2px 2px 0 var(--ink)}
.gquit{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;width:40px;height:36px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.garea{position:relative;height:360px;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:#cfe8f5;touch-action:none;user-select:none;-webkit-user-select:none}
.gintro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;background:#fff7e4ee;z-index:20}
.gintro h2{margin:0;font-family:var(--display);font-weight:400;letter-spacing:2px;font-size:40px;color:var(--red);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.gintro p{margin:0;font-size:16px;line-height:1.5;max-width:520px}
.gintro .stars3{margin:0}
.gfoot{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap;min-height:10px}
/* hoops */
.hoops{background:linear-gradient(#bfe3f2 0 70%,#f08a3c 70%)}
.hoops .board{position:absolute;left:50%;top:26px;width:150px;height:96px;margin-left:-75px;background:#fff;border:4px solid var(--ink);border-radius:6px}
.hoops .board:after{content:'';position:absolute;left:46px;top:30px;width:50px;height:36px;border:4px solid var(--red)}
.hoops .rim{position:absolute;left:50%;top:118px;width:84px;height:16px;margin-left:-42px;border:5px solid #f08a3c;border-radius:50%;z-index:3}
.hoops .net{position:absolute;left:50%;top:126px;width:70px;height:46px;margin-left:-35px;background:repeating-linear-gradient(60deg,transparent 0 8px,#fff 8px 10px),repeating-linear-gradient(-60deg,transparent 0 8px,#fff 8px 10px);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);opacity:.9}
.hoops .ball{position:absolute;left:50%;bottom:30px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:#f08a3c;border:4px solid var(--ink);z-index:4}
.hoops .ball:before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,transparent 46%,var(--ink) 46% 54%,transparent 54%),linear-gradient(transparent 46%,var(--ink) 46% 54%,transparent 54%)}
.power{position:absolute;left:8%;right:8%;bottom:104px;height:26px;background:#fff;border:4px solid var(--ink);border-radius:14px;overflow:hidden}
.power .zone{position:absolute;top:0;bottom:0;background:#5be37a}
.power .needle{position:absolute;top:-4px;bottom:-4px;width:8px;margin-left:-4px;background:var(--ink);border-radius:4px}
.shotmsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-size:44px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);z-index:6;pointer-events:none;animation:toastIn .3s cubic-bezier(.3,1.6,.5,1)}
.partner{position:absolute;bottom:6px;height:150px;z-index:2}
.partner.l{left:2%}.partner.r{right:2%}
/* thoughts */
.thoughts{background:linear-gradient(#5a4fa8,#ff9a6b)}
.basket{position:absolute;bottom:12px;width:120px;height:54px;margin-left:-60px;background:#ffd23f;border:4px solid var(--ink);border-radius:8px 8px 40px 40px;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:26px;z-index:3}
.tb{position:absolute;padding:7px 12px;border:3px solid var(--ink);border-radius:20px;font-size:14px;white-space:nowrap;box-shadow:3px 3px 0 #0004;z-index:2;direction:var(--dir)}
.tb.good{background:#c9f5d2}.tb.bad{background:#59617a;color:#fff}
.tb.good:before{content:'💚 '}.tb.bad:before{content:'⛈️ '}
.pop{position:absolute;font-family:var(--display);font-size:28px;-webkit-text-stroke:1px var(--ink);pointer-events:none;animation:floatUp .9s forwards;z-index:5}
/* barista */
.barista{background:linear-gradient(#e9c9a8 0 64%,#a8683a 64%)}
.ticket{position:absolute;left:50%;top:24px;transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:8px;padding:10px 16px;min-width:200px;min-height:80px;box-shadow:4px 4px 0 var(--ink);text-align:center}
.ticket .tt{font-family:var(--display);font-size:16px;letter-spacing:1px;color:#6b6458}
.ticket .seq{font-size:38px;letter-spacing:6px;min-height:46px}
.cup{position:absolute;left:50%;top:150px;transform:translateX(-50%);font-size:34px;letter-spacing:4px;min-height:44px;background:#fff7e4;border:3px dashed var(--ink);border-radius:10px;padding:2px 14px;min-width:160px;text-align:center}
.items{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 10px}
.items button{font-size:36px;width:64px;height:64px;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.items button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.items button:disabled{opacity:.5}
/* match */
.match{background:#2f6a66;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;height:auto;min-height:360px}
.mcard{position:relative;border:4px solid var(--ink);border-radius:12px;background:var(--yellow);box-shadow:4px 4px 0 var(--ink);font-size:16px;min-height:96px;display:grid;place-items:center;padding:4px}
.mcard .f{display:none;text-align:center}
.mcard .b{font-family:var(--display);font-size:34px}
.mcard.up,.mcard.done{background:#fff}
.mcard.up .f,.mcard.done .f{display:block}
.mcard.up .b,.mcard.done .b{display:none}
.mcard.done{background:#c9f5d2}
.mcard .em{font-size:44px;line-height:1}
.mcard .wd{font-family:var(--display);font-size:22px;letter-spacing:1px}
/* chat */
.chatg{background:#e5ddd5;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;gap:8px}
.cm{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 8px;box-shadow:2px 2px 0 #0003;animation:memoIn .3s;direction:var(--dir)}
.cm .tx{flex:1;font-size:14px}
.cm button{border:3px solid var(--ink);border-radius:10px;padding:4px 8px;font-size:13px;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.cm button.rep{background:#ffd3cc}.cm button.lv{background:#ffe0ea}
.cm.ok{background:#c9f5d2}.cm.no{background:#ffd3cc}
/* breath */
.breathg{background:radial-gradient(circle,#d6fff4,#68c3b2)}
.bcircle{position:absolute;left:50%;top:44%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8fd3c7);border:5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:scale(.5)}
.btext{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-family:var(--display);font-size:30px;z-index:2}
.holdbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:24px;touch-action:none}
.holdbtn.on{background:#5be37a}
.bacc{position:absolute;top:10px;inset-inline-end:12px;font-family:var(--display);font-size:20px}
/* talk */
.talkg{background:#fff4cf;padding:16px;height:auto;min-height:360px;text-align:center}
.talkg .sit{font-size:16px;line-height:1.5;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;margin-bottom:12px;direction:var(--dir)}
.talkg .sent{min-height:56px;font-size:18px;line-height:1.5;margin-bottom:12px;direction:var(--dir)}
.talkg .sent span{display:inline-block;margin:2px;padding:2px 8px;border-radius:8px;border:2px solid var(--ink)}
.talkg .sent .g{background:#c9f5d2}.talkg .sent .x{background:#ffd3cc}
.talkg .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.talkg .opts button{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:16px;box-shadow:4px 4px 0 var(--ink)}

/* ======== phones ======== */
@media(max-width:700px){
 .game{padding:8px 8px 20px}
 .hud{gap:6px}
 .logo{font-size:21px}
 .meter{order:5;flex:1 1 140px;padding:4px 8px 4px 6px;gap:5px}
 .meter .bar{flex:1;width:auto;height:12px}
 .meter .ml{font-size:13px}.meter .mv{font-size:14px;min-width:20px}
 .hrs{order:6;font-size:15px;padding:3px 6px}
 .badge{font-size:14px;padding:4px 7px 2px}
 .badge.day,.badge.star{order:7}
 .tools{display:none}
 .icon-btn{height:34px;min-width:38px}
 .stage{height:520px;min-height:0}
 .actor{height:33%}
 .stage.indoor .actor{height:36%}
 .osign{font-size:14px}
 .exit .arrowsign{font-size:14px;padding:4px 7px 2px}
 .quest{font-size:11px;max-width:62%;padding:5px 8px}
 .quest b{font-size:13px}
 .areatag{font-size:13px;top:12px;padding:4px 7px 2px}
 .sun{width:46px;height:46px}
 .act{font-size:17px;padding:8px 16px 6px}
 .controls{flex-wrap:wrap}
 .controls p{font-size:12px}
 .overlay,.dialogue{position:fixed;inset:0;z-index:100;border-radius:0;border:0;box-shadow:none}
 .overlay{align-items:flex-start;padding:14px 10px 24px}
 .phone-ov{z-index:140}.game-ov{z-index:150}
 .toast{position:fixed;top:36%;z-index:300;width:170px;height:116px;margin-left:-85px}
 .memo{position:fixed;bottom:16px;z-index:300}
 .fader{position:fixed;z-index:400}
 .qopts{grid-template-columns:1fr;gap:9px}
 .qopts button{padding:11px 13px;font-size:15px}
 .qopts.emoji{grid-template-columns:repeat(3,1fr)}
 .qopts.emoji button{font-size:40px;padding:8px}
 .result{grid-template-columns:1fr;text-align:center;padding:14px}
 .res-hero{height:240px}
 .res-name{font-size:46px}
 .cards{gap:10px;grid-template-columns:repeat(3,1fr)}
 .card{height:150px}
 .card .kw{height:236px;top:8px}
 .card .tape{font-size:13px;padding:4px 9px 3px}
 .select h2{font-size:30px}
 .btn{font-size:20px}
 .lineup{height:112px}.mate-fig{height:88px}.mate-fig.me{height:100px}.mate-fig.adult{height:100px}
 .dialogue{display:flex;flex-direction:column;gap:12px;padding:10px 12px 22px}
 .step{font-size:15px}
 .read,.notnow{font-size:12px;padding:4px 8px}
 .read .rl{display:none}
 .panel{--fh:150px}
 .intro .panel{--fh:140px}
 .q-scene{min-height:0;flex:0 0 auto}
 .phead{padding:7px 7px 0}
 .phead .cap{font-size:15px;padding:5px 8px 4px}
 .sfx{width:88px;height:62px}
 .sfx span{font-size:18px;max-width:78px}
 .bubble{font-size:11.5px;padding:6px 7px;border-radius:14px;margin-bottom:14px;border-width:2.5px}
 .slot>.tape{font-size:11px;padding:4px 8px 3px}
 .prow{gap:3px;padding:4px 4px 6px}
 .decision{padding:0}
 .asks{font-size:17px}
 .choices button{font-size:14px;padding:8px 10px}
 .res p{font-size:14px}
 .narr{font-size:13px}
 .credit-m{display:table}
 .phonebox{border-radius:26px;padding:14px 10px}
 .pscreen{max-height:none;min-height:60vh}
 .ptabs button{font-size:12px}
 .garea{height:340px}
 .match{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
 .mcard{min-height:76px}
 .mcard .em{font-size:36px}.mcard .wd{font-size:18px}
 .items button{width:54px;height:54px;font-size:30px}
 .talkg .opts{grid-template-columns:1fr}
 .partner{height:110px}
 .tc-part{font-size:26px}
}
@media(max-width:380px){.card{height:132px}.card .kw{height:210px}.panel{--fh:132px}}
@media(min-width:701px) and (max-height:780px){.logo-big,html[lang=ar] .logo-big{font-size:54px}.lineup{height:112px}.mate-fig{height:90px}.mate-fig.me{height:104px}.tagline{margin-bottom:8px}.langpick{margin:8px 0 4px}.card{height:178px}.card .kw{height:276px}.res-hero{height:290px}.intro .panel{--fh:150px}.intro .narr{margin:10px auto}.garea{height:320px}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important}}

@media (hover:none){.controls .kbd{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs id="gdefs">
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc0ee"/><stop offset="1" stop-color="#dff4ff"/></linearGradient>
  <pattern id="pStripe" width="40" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="#e8433a"/><rect x="20" width="20" height="10" fill="#fff7e4"/></pattern>
  <pattern id="pShm" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fbfaf4"/><rect x="1" y="1" width="4" height="4" fill="#d6413a"/><rect x="6" y="6" width="3" height="3" fill="#d6413a"/></pattern>
 </defs>
</svg>
<main class="game">
 <div class="hud">
  <div class="logo" data-t="logo">LIFE QUEST!</div>
  <div class="meter mood" id="moodMeter"><span class="ml">❤ <span data-t="mood">MOOD</span></span><div class="bar"><i id="moodBar"></i></div><span class="mv" id="moodVal">60</span></div>
  <div class="hrs" id="hrs" role="img"></div>
  <div class="badge day" id="dayBadge"></div>
  <div class="badge star" id="starBadge">⭐ 0</div>
  <div class="tools"><span class="tool" id="t_breath">🌬️</span><span class="tool" id="t_talk">💬</span><span class="tool" id="t_think">🧠</span></div>
  <button class="icon-btn phone" id="phoneBtn" aria-label="Phone">📱<span class="dot" id="phoneDot" hidden>!</span></button>
  <button class="icon-btn lang js-lang" id="langBtn" aria-label="عربي">ع</button>
  <button class="icon-btn" id="sound" aria-label="Sound on">🔊</button>
 </div>

 <div class="stage t-morning" id="stage">
  <div class="sky"><div class="stars"></div><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div></div>
  <div class="skyline" id="skyline"></div>
  <div class="world" id="world">
   <div id="ground"></div>
   <div id="objs"></div>
   <div id="npcs"></div>
   <div class="actor" id="player" style="left:0"><div class="you-mark" data-t="you">YOU</div><div class="pbubble" id="pBubble" hidden></div><div class="inner" id="playerArt"></div><div class="shadow"></div><span class="tape" id="playerName"></span></div>
   <div class="shade"></div>
  </div>
  <div class="quest"><b data-t="quest">YOUR QUEST</b><span id="q1"></span><span id="q2"></span></div>
  <div class="areatag" id="areatag"></div>
  <div class="actwrap"><button class="btn act" id="actBtn" hidden></button></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="memo" id="memo" role="status" hidden></div>
  <div class="fader" id="fader"></div>

  <!-- Scene card (story events + counselor) -->
  <section class="dialogue" id="dialogue" hidden aria-label="Scene">
   <div class="dlg-top"><span class="step" id="chapter"></span><button class="notnow" id="notNow"></button><button class="read" id="read"></button><button class="icon-btn lang js-lang" aria-label="language"></button></div>
   <div class="panel q-scene" id="scenePanel" role="img"></div>
   <div class="decision" id="decision"></div>
  </section>

  <!-- Start -->
  <div class="overlay" id="startOverlay">
   <div class="panelwrap">
    <div class="logo-big"><span data-t="title1">LIFE</span><span data-t="title2">QUEST!</span></div>
    <div class="cap tagline" data-t="tagline"></div>
    <div class="lineup" id="startLineup"></div>
    <div class="langpick"><button class="en" data-lang="en" aria-pressed="true">ENGLISH</button><button class="ar" data-lang="ar" aria-pressed="false">عربي</button></div>
    <div class="startbtns"><button class="btn" id="contBtn" hidden></button><button class="btn" id="findBtn" data-t="findMe"></button></div>
    <p class="sub" id="contSub" hidden></p>
    <p class="sub" data-t="findSub"></p>
    <div><button class="link" id="pickSelfBtn" data-t="pickSelf"></button></div>
    <div class="credit credit-m" data-th="credit" style="margin-top:12px"></div>
   </div>
  </div>
  <!-- Quiz -->
  <div class="overlay" id="quizOverlay" hidden><div class="panelwrap quiz"><div class="qprog" id="qProg"></div><div class="qdots" id="qDots"></div><h2 class="qtitle" id="qTitle"></h2><div class="qopts" id="qOpts"></div></div></div>
  <!-- Result -->
  <div class="overlay" id="resultOverlay" hidden>
   <div class="panelwrap result paper">
    <div class="res-hero" id="resHero"></div>
    <div><div class="cap" data-t="youAre"></div><div class="res-name" id="resName"></div><span class="tape" id="resTag"></span><p class="res-desc" id="resDesc"></p><button class="btn" id="playAsBtn"></button><div><button class="link" id="pickOtherBtn" data-t="pickOther"></button> · <button class="link" id="retakeBtn" data-t="retake"></button></div></div>
   </div>
  </div>
  <!-- Select -->
  <div class="overlay" id="selectOverlay" hidden><div class="panelwrap select"><h2 data-t="chooseHero"></h2><div class="cards" id="cards"></div><div class="picked" id="picked"></div><button class="btn" id="selectStart" disabled></button></div></div>
  <!-- Intro -->
  <div class="overlay" id="introOverlay" hidden><div class="panelwrap intro"><div class="panel" id="introPanel"></div><div class="narr" id="introNarr"></div><button class="btn" id="introGo" data-t="letsGo"></button></div></div>
  <!-- Time card -->
  <div class="overlay" id="timeOverlay" hidden><div class="panelwrap timecard"><div class="tc-day" id="tcDay"></div><div class="tc-part" id="tcPart"></div><p class="tc-sub" id="tcSub"></p><div class="missed" id="tcMissed" hidden></div><button class="btn" id="tcGo" data-t="go"></button></div></div>
  <!-- Quick chat -->
  <div class="overlay dim" id="chatOverlay" hidden><div class="panelwrap paper" style="max-width:560px"><div class="panel" id="chatPanel" style="--fh:170px"></div><div class="optlist" id="chatOpts"></div></div></div>
  <!-- Phone -->
  <div class="overlay dim phone-ov" id="phoneOverlay" hidden>
   <div class="phonebox"><div class="notch"></div><button class="pclose" id="phoneClose" aria-label="Close">✕</button>
    <div class="pscreen"><div class="ptabs" id="ptabs"><button data-tab="bonds" data-t="tabBonds"></button><button data-tab="map" data-t="tabMap"></button><button data-tab="tools" data-t="tabTools"></button><button data-tab="story" data-t="tabStory"></button></div><div id="pbody"></div><button class="btn endpart" id="endPartBtn" data-t="endPart"></button></div>
   </div>
  </div>
  <!-- Confirm -->
  <div class="overlay dim" id="confirmOverlay" hidden style="z-index:160"><div class="panelwrap paper confirm"><p id="confirmText"></p><div class="row"><button class="btn" id="confirmYes" data-t="yes"></button><button class="btn ghost" id="confirmNo" data-t="no"></button></div></div></div>
  <!-- Mini-game -->
  <div class="overlay dim game-ov" id="gameOverlay" hidden>
   <div class="gbox"><div class="ghead"><span class="cap" id="gTitle"></span><span class="gstat" id="gStat"></span><span class="gstat" id="gTime"></span><button class="gquit" id="gQuit" aria-label="Quit">✕</button></div><div class="garea" id="gArea"></div><div class="gfoot" id="gFoot"></div></div>
  </div>
  <!-- Ending -->
  <div class="overlay" id="endOverlay" hidden>
   <div class="confetti" id="confetti"></div>
   <div class="panelwrap paper end-panel">
    <button class="icon-btn lang js-lang endlang" aria-label="language"></button>
    <div class="cap" data-t="weekDone"></div>
    <div class="stars3" id="endStars" role="img"></div>
    <h1 class="end-title" id="endTitle"></h1>
    <div class="lineup" id="endLineup"></div>
    <p class="end-text" id="endText"></p>
    <div class="says" id="endSays"></div>
    <p class="small" id="endStats"></p>
    <div class="safety" data-t="safety"></div>
    <details><summary data-t="tabStory"></summary><div id="endStory"></div></details>
    <p><button class="btn" id="restart" data-t="playAgain"></button></p>
    <p class="small" data-t="notTest"></p>
   </div>
  </div>
 </div>

 <div class="controls">
  <p><span class="kbd"><b data-t="move">MOVE:</b> ← → / A D &nbsp; <b data-t="useKey">ACTION:</b> E<br></span><span data-t="moveHelp"></span></p>
  <div class="arrows"><button class="calm-btn" id="calmBtn" data-t="calm"></button><button id="left" aria-label="Walk left">←</button><button id="right" aria-label="Walk right">→</button></div>
 </div>
 <footer><div class="credit" data-th="credit"></div><span data-t="footer"></span></footer>

 }

 if(lid){
  F.eyes.forEach(e=>{

 }

 }else if(mood==='sad')s+='<path d="M'+f(a+2)+' '+f(my+4)+' Q'+mx+' '+f(my-4)+' '+f(c-2)+' '+f(my+4)+'"'+st+'/>';
 else if(mood==='worried')s+='<path d="M'+f(a+1)+' '+f(my+2)+' Q'+f(a+W/4)+' '+f(my-3)+' '+mx+' '+f(my+1)+' Q'+f(c-W/4)+' '+f(my+5)+' '+f(c-1)+' '+f(my)+'"'+st+'/>';
 else if(mood==='tired')s+='<path d="M'+f(a+4)+' '+f(my+1)+' Q'+mx+' '+f(my+3)+' '+f(c-4)+' '+f(my+1)+'"'+st+'/>';
 else if(mood==='serious')s+='<path d="M'+f(a+3)+' '+f(my+1)+' L'+f(c-3)+' '+f(my+1)+'"'+st+'/>';
 else if(mood==='shocked')s+='<ellipse cx="'+mx+'" cy="'+f(my+1)+'" rx="'+f(W*.2)+'" ry="'+f(W*.26)+'" fill="#7a2422" stroke="'+ink+'" stroke-width="2.6"/>';
 else if(mood==='smug')s+='<path d="M'+f(a+3)+' '+f(my+1)+' Q'+f(mx+2)+' '+f(my+5)+' '+f(c)+' '+f(my-4)+'"'+st+'/>';

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp100=v=>Math.max(0,Math.min(100,Math.round(v)));
let LANG='en',S=null,sel=null,curNPC=null,curPhone='beach';
const heroKey=()=>S?S.hero:sel;
const isF=()=>{const h=heroKey();return !!(h&&KIDS[h].f);};
function raw(o){if(o==null)return '';if(typeof o==='string')return o;return o[LANG]!=null?o[LANG]:o.en;}
const titleCase=s=>LANG==='en'?s.charAt(0)+s.slice(1).toLowerCase():s;
function T(o){let s=raw(o);const f=isF();s=s.replace(/\{([^{}|]*)\|([^{}]*)\}/g,(_,a,b)=>f?b:a);return s.replace(/%N/g,curNPC?nameOf(curNPC):'').replace(/%H/g,heroKey()?nameOf(heroKey()):'');}
function nameOf(k,tape){if(KIDS[k]){const n=raw(KIDS[k].name);return tape?n:titleCase(n);}return OTHER_LABEL[k]?T(OTHER_LABEL[k]):'';}
function U(k,rep){let o=UI;for(const p of k.split('.'))o=o?o[p]:null;let s=T(o);if(rep)for(const r in rep)s=s.split(r).join(rep[r]);return s;}
const ARR=()=>LANG==='ar'?'◄':'►';

/* ================= SOUND ================= */
let soundOn=true,ac=null;
function tone(freqs,dur,type,gap,vol){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime;freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),st=t+i*gap;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+.02);g.gain.exponentialRampToValueAtTime(0.0001,st+dur);o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+dur+.05);});}catch(e){}}
const sfx={click:()=>tone([660],.08,'triangle',0,.08),good:()=>tone([523,659,784,1047],.2,'square',.08,.05),bad:()=>tone([330,247],.25,'triangle',.13,.1),win:()=>tone([523,659,784,1047,1319],.3,'sine',.12,.13),door:()=>tone([392,523],.14,'sine',.09,.09),pick:()=>tone([784,988],.1,'square',.06,.04),tool:()=>tone([659,880,1175,1568],.18,'square',.07,.05),star:()=>tone([988,1319,1568],.12,'triangle',.06,.07),pop:()=>tone([880],.06,'square',0,.04),miss:()=>tone([220],.15,'sawtooth',0,.05)};
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';$('sound').setAttribute('aria-label',soundOn?'Sound on':'Sound off');if(soundOn)sfx.click();});

function kidHTML(k,mood,extra){return '<div class="kw'+(extra||'')+'" style="aspect-ratio:'+SPR_AR[k]+'"><img src="'+SPR[k]+'" alt="" draggable="false">'+faceOverlay(k,mood,SPR_W[k])+'</div>';}
function avatarStyle(k){const F0=FACE[k],fx=(F0.eyes[0][0]+F0.eyes[1][0])/2,fy=(F0.eyes[0][1]+F0.eyes[1][1])/2+14,sc=.62;return 'background-image:url('+SPR[k]+');background-size:'+(SPR_W[k]*sc)+'px auto;background-position:'+(25-fx*sc)+'px '+(25-fy*sc)+'px;--c:'+KIDS[k].color;}
function figHTML(key,mood){
 const ema=(EMA[mood]&&key!=='phone')?'<div class="ema ema-'+mood+'">'+EMA[mood]+'</div>':'';
 const sh=mood==='angry'?' shake':'';
 if(KIDS[key])return '<div class="fig kid'+sh+'">'+kidHTML(key,mood)+ema+'</div>';
 if(key==='phone')return '<div class="fig phone">'+phoneSVG(curPhone)+'</div>';
 if(key==='doctor'||key==='mom'||key==='dad')return '<div class="fig adult'+sh+'">'+adultSVG(key,mood)+ema+'</div>';
 return '<div class="fig teen'+sh+'">'+teenSVG(key,mood,isF())+ema+'</div>';
}
function panelHTML(o){
 let h='<div class="rays '+(o.rays||'')+'"></div><div class="floorline"></div>'+(o.night?'<div class="moonp"></div>':'');
 if(o.prop&&PROPS[o.prop])h+='<div class="prop">'+PROPS[o.prop]+'</div>';
 h+='<div class="phead"><div class="cap">'+esc(o.cap)+(o.place?'<small>'+esc(o.place)+'</small>':'')+'</div>';
 if(o.sfx&&o.sfx[0])h+='<div class="sfx'+(o.boom?' boom':'')+'" style="--c:'+o.sfx[1]+'">'+burstSVG('#fffbe6',11)+'<span>'+esc(o.sfx[0])+'</span></div>';
 h+='</div><div class="prow">';
 o.slots.forEach(s=>{
  h+='<div class="slot'+(s.hero?' hero':'')+'">'+(s.text?'<div class="bubble '+(s.type||'say')+'">'+esc(s.text)+'</div>':'<div class="bubble-spacer"></div>')+figHTML(s.key,s.mood);
  if(s.key!=='phone')h+='<span class="tape">'+(s.hero?'★ ':'')+esc(nameOf(s.key,true))+'</span>';
  h+='</div>';
 });
 return h+'</div>';
}
function panelLook(){
 const A=S?AREAS[S.area]:AREAS.neigh,b=S?BLOCKS[Math.min(S.block,5)]:BLOCKS[0],base=AREA_PANEL[S?S.area:'neigh'];
 if(A.indoor)return {wall:base.wall,prop:base.prop,night:false};
 if(b.sky==='night')return {wall:'#3a3f7a',prop:base.prop,night:true};
 if(b.sky==='sunset')return {wall:'#ffc9a0',prop:base.prop,night:false};
 return {wall:base.wall,prop:base.prop,night:false};
}

/* ================= STATE / SAVE ================= */
const SAVE='lifeQuest3',ENDKEY='lifeQuest3Endings';
function newState(h){const bonds={},arcs={};ORDER.forEach(k=>{if(k!==h){bonds[k]=50;arcs[k]={stage:0,res:[]};}});return {v:3,hero:h,mood:60,bonds,arcs,main:{stage:0,res:[]},block:0,budget:BLOCKS[0].budget,area:'neigh',x:.16,tools:{breath:false,talk:false,think:false},stars:{},talked:{},played:{},snacks:{},counsel:{},hi:{},log:[],done:false};}
function save(){if(!S)return;try{localStorage.setItem(SAVE,JSON.stringify({S,LANG}))}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE)||'null');if(d&&d.S&&d.S.v===3&&!d.S.done&&KIDS[d.S.hero])return d;}catch(e){}return null;}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}
function getEndings(){try{return JSON.parse(localStorage.getItem(ENDKEY)||'[]')}catch(e){return []}}
function addEnding(id){try{const a=getEndings();if(!a.includes(id)){a.push(id);localStorage.setItem(ENDKEY,JSON.stringify(a));}return a.length;}catch(e){return 1}}
function eventKey(who){const arc=who==='main'?S.main:S.arcs[who];if(!arc)return null;return who+(arc.stage+1);}
function eventAvail(who){const k=eventKey(who),e=k&&EV[k];return !!(e&&e.win.includes(S.block));}
function siblings(){return ORDER.filter(k=>k!==S.hero);}
function bondTier(k){const b=S.bonds[k];return b<35?0:b<70?1:2;}
function npcMood(k){if(eventAvail(k)&&S.budget>0){const e=EV[eventKey(k)];const j=e.cast.indexOf('npc');return e.setup.moods[j]||'worried';}const b=S.bonds[k];return b<30?'sad':b<45?'serious':b<70?'calm':'happy';}
function moodFace(){const m=S?S.mood:60;return m>=65?'happy':m>=45?'calm':m>=30?'worried':'sad';}

 });

 (A.stars||[]).forEach((x,i)=>{const id=S.area+i;if(!S.stars[id])h+='<div class="cstar" data-id="'+id+'" data-x="'+x+'" style="left:'+(x*100)+'%">⭐</div>';});

function renderQuest(){
 if(!S)return;const day=BLOCKS[Math.min(S.block,5)].part==='day';
 let q1;if(S.budget<=0)q1=U('qNoTime');else if(day&&eventAvail('main'))q1=U('qMain',{'%T':T(EV[eventKey('main')].title)});else q1=U('qFree');

function canMove(){return playing&&!!S&&!anyOverlay();}
function sayPlayer(text){const b=$('pBubble');b.textContent=text;b.hidden=false;clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>b.hidden=true,1800);}
function itLabel(it){
 if(it.kind==='npc')return '💬 '+U('interact.talk')+' · '+nameOf(it.k,true);
 if(it.kind==='exit')return '➜ '+U('interact.go')+' · '+raw(AREAS[it.o.to].name);
 const a=it.o.act,day=BLOCKS[Math.min(S.block,5)].part==='day',nm=it.o.sign?raw(it.o.sign):'';
 if(a.day&&!day)return '🔒 '+U('interact.closed');
 if(a.type==='game')return '🎮 '+U('interact.play')+' · '+T(GT[a.g].t);
 if(a.type==='snack')return '🍬 '+U('interact.snack')+' · '+nm;
 if(a.type==='main')return (eventAvail('main')&&S.budget>0?'⭐ ':'🚪 ')+U('interact.enter')+' · '+nm;
 return '🚪 '+U('interact.enter')+' · '+nm;
}
function loop(time){
 const dt=Math.min((time-last)/1000||0,.05);last=time;
 if(S&&playing){
  let dir=(keys.has('R')?1:0)-(keys.has('L')?1:0);
  const speed=(Math.min(stageW,900)*.5)/worldW;
  if(canMove()){
   if(dir){target=null;autoAct=null;S.x=Math.max(.012,Math.min(.988,S.x+dir*speed*dt));}
   else if(target!=null){const d=target-S.x,step=speed*dt;if(Math.abs(d)<=step){S.x=target;target=null;if(autoAct){const a=autoAct;autoAct=null;interact(a);}}else{dir=Math.sign(d);S.x+=dir*step;}}
  }else dir=0;
  const px=S.x*worldW;camX=Math.max(0,Math.min(worldW-stageW,px-stageW*.45));
  $('world').style.transform='translateX('+(-camX)+'px)';$('skyline').style.transform='translateX('+(-camX*.35)+'px)';
  const pl=$('player');pl.style.left=px+'px';pl.classList.toggle('walking',dir!==0);if(dir)pl.classList.toggle('flip',dir<0);
  document.querySelectorAll('#npcs .npc').forEach(n=>{const x=parseFloat(n.style.left)/100;n.classList.toggle('flip',x>S.x);});
  // nearest interactable
  let best=null,bd=(stageW*.075)/worldW;
  if(canMove())IT.forEach(it=>{const d=Math.abs(it.x-S.x);if(d<bd){bd=d;best=it;}});
  nearIt=best;const sig=best?(S.area+best.kind+(best.k||'')+(best.o?best.o.x:'')+LANG+S.budget+S.block):'';
  if(sig!==actSig){actSig=sig;const b=$('actBtn');if(best){b.hidden=false;b.textContent=itLabel(best)+(TOUCH?'':' [E]');b.classList.toggle('closed',!!(best.kind==='obj'&&best.o.act.day&&BLOCKS[Math.min(S.block,5)].part!=='day'));b.classList.toggle('pulse',!!(best.kind==='npc'?eventAvail(best.k)&&S.budget>0:best.kind==='obj'&&best.o.act.type==='main'&&eventAvail('main')&&S.budget>0));}else b.hidden=true;}
  // stars
  document.querySelectorAll('.cstar:not(.got)').forEach(s=>{if(Math.abs(parseFloat(s.dataset.x)-S.x)<(stageW*.03)/worldW){s.classList.add('got');S.stars[s.dataset.id]=1;sfx.star();renderHUD();memo(U('starGot')+' '+Object.keys(S.stars).length+'/12');save();setTimeout(()=>s.remove(),700);}});
 }
 requestAnimationFrame(loop);
}
const KEYMAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R'};
window.addEventListener('keydown',e=>{
 if(G.active&&G.key&&G.key(e,true))return;
 const dir=KEYMAP[e.code]||KEYMAP[e.key];
 if(dir){if(canMove()){e.preventDefault();keys.add(dir);}return;}
 if((e.code==='KeyE'||e.code==='Enter')&&!e.repeat&&canMove()&&nearIt){e.preventDefault();interact(nearIt);}
});
window.addEventListener('keyup',e=>{if(G.active&&G.key&&G.key(e,false))return;const dir=KEYMAP[e.code]||KEYMAP[e.key];if(dir)keys.delete(dir);});
window.addEventListener('blur',()=>keys.clear());
for(const [id,key] of [['left','L'],['right','R']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!canMove())return;try{b.setPointerCapture(e.pointerId)}catch(_){}keys.add(key);target=null;autoAct=null;});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(key));}
$('stage').addEventListener('pointerdown',e=>{if(!canMove()||e.target.closest('button,.overlay,.dialogue,[data-it]'))return;const r=$('stage').getBoundingClientRect();target=Math.max(.012,Math.min(.988,(e.clientX-r.left+camX)/worldW));autoAct=null;});
$('actBtn').addEventListener('click',()=>{if(canMove()&&nearIt)interact(nearIt);});

function travel(to,x){
 sfx.door();const f=$('fader');f.classList.add('on');keys.clear();target=null;autoAct=null;
 setTimeout(()=>{S.area=to;S.x=x;renderArea();save();f.classList.remove('on');},230);
}
function interact(it){
 if(!canMove())return;keys.clear();target=null;
 if(it.kind==='npc')return talkTo(it.k);
 if(it.kind==='exit'){const i=AREA_ORDER.indexOf(it.o.to),me=AREA_ORDER.indexOf(S.area);return travel(it.o.to,i<me?.94:.06);}
 const a=it.o.act,day=BLOCKS[Math.min(S.block,5)].part==='day';
 if(a.day&&!day){sayPlayer(U('closedMsg'));sfx.miss();return;}
 if(a.type==='area')return travel(a.to,a.at);
 if(a.type==='snack'){const k=S.area+S.block;if(S.snacks[k]){sayPlayer(U('snackDone'));return;}S.snacks[k]=1;changeMood(5);sfx.good();memo(U('snackMsg'));renderArea(true);save();return;}
 if(a.type==='game')return openGame(a.g,{partner:partnerNear()});
 if(a.type==='counselor')return openCounselor();
 if(a.type==='main'){
  if(eventAvail('main')&&S.budget>0)return openEvent(eventKey('main'));
  sayPlayer(S.budget<=0?U('qNoTime'):U('qFree'));return;
 }
}
function partnerNear(){let best=null,bd=.2;siblings().forEach(k=>{const p=POS[Math.min(S.block,5)][k];if(p&&p[0]===S.area){const d=Math.abs(p[1]-S.x);if(d<bd){bd=d;best=k;}}});return best;}

 h+='<div class="asks"><span class="av" style="'+avatarStyle(S.hero)+'"></span><span>'+esc(ev.choice==null?U('whatDo'):U('happened'))+'</span></div><div class="choices">';
 e.choices.forEach((c,i)=>{
  if(ev.choice!=null&&ev.choice!==i)return;
  const locked=c.need&&!S.tools[c.need],tl=c.need?(c.need==='breath'?'🌬️ ':c.need==='talk'?'💬 ':'🧠 ')+U('tools.'+c.need):'';
  h+='<button data-i="'+i+'" class="'+(c.need?'toolopt ':'')+(c.game?'gameopt ':'')+(ev.choice===i?'chosen':'')+'"'+(locked||ev.choice!=null?' disabled':'')+' style="--k:'+['#ffd23f','#7fc8f8','#ff9fb2','#a8e6a1'][i]+'"><span class="arrow">'+(locked?'🔒':c.game?'🎮':'►')+'</span><span>'+(c.need?'<span class="chip">'+esc(locked?U('needs',{'%T':tl}):tl)+'</span>':'')+esc(T(c.t))+'</span></button>';
 });
 h+='</div>';
 if(ev.choice!=null){

function chip(label,d){return '<span class="'+(d>0?'up':d<0?'down':'zero')+'">'+(d>0?'+':d<0?'−':'±')+Math.abs(d)+' '+esc(label)+'</span>';}
function choose(i){
 const e=EV[ev.key],c=e.choices[i];if(ev.choice!=null||(c.need&&!S.tools[c.need]))return;
 stopSpeech();
 if(c.game){openGame(c.game,{inEvent:true,partner:e.who!=='main'?e.who:null,onEnd:st=>finishChoice(i,st>=2?'great':'good')});return;}
 finishChoice(i,c.res);

function finishChoice(i,res){

 S.log.push({b:S.block,key:ev.key,i,res});S.budget=Math.max(0,S.budget-1);
 (res==='great'||res==='good'?sfx.good:res==='bad'?sfx.bad:sfx.click)();
 memo(T(MEM[e.who]));renderHUD();save();renderEvent(true);
 const r=$('decision').querySelector('.res');if(r)r.scrollIntoView({block:'nearest',behavior:'smooth'});
}

 let stage='hi',busy=eventAvail(k)&&S.budget<=0;sfx.pop();
 openChatCard(function r(){
  curNPC=k;const tier=bondTier(k),look=panelLook();
  const line=busy?T(X('You look busy. Later?','شكلك مشغول{|ة}. بعدين؟')):stage==='hi'?T(CHAT[k][tier]):stage==='ask'?T(CHAT_REPLY.react[tier]):T(CHAT_REPLY.seeya);
  const el=$('chatPanel');el.className='panel'+(look.night?' night':'');el.style.setProperty('--wall',look.wall);
  el.innerHTML=panelHTML({cap:U('chatTitle'),place:raw(AREAS[S.area].name),prop:look.prop,night:look.night,slots:[{key:k,mood:stage==='ask'&&tier>0?'happy':npcMood(k),text:line},{key:S.hero,hero:true,mood:moodFace(),text:''}]});

function openCounselor(){
 sfx.door();
 openChatCard(function r(){
  curNPC=null;const busy=!!S.counsel[S.block];

function arcScore(arc){return arc.res.reduce((a,r)=>a+({great:3,good:2,mid:1}[r]||0),0);}
function arcResult(arc){const s=arcScore(arc);return s>=6?'saved':s>=3?'ok':'broken';}
function endBlock(){
 const missed=[];
 ['main',...Object.keys(S.arcs)].forEach(who=>{
  const arc=who==='main'?S.main:S.arcs[who],k=eventKey(who),e=EV[k];
  if(e&&Math.max(...e.win)<=S.block){arc.res.push('missed');arc.stage++;if(who==='main'){S.mood=clamp100(S.mood-8);missed.push(U('missedMain',{'%T':T(e.title)}));}else{changeBond(who,-5);curNPC=who;missed.push(U('missedArc',{'%N':nameOf(who)}));curNPC=null;}}
 });
 S.block++;
 if(S.block>=BLOCKS.length){S.done=true;playing=false;clearSave();finale();return;}
 const b=BLOCKS[Math.min(S.block,5)];S.budget=b.budget;S.area=b.part==='day'?'neigh':'home';S.x=b.part==='day'?.16:.12;
 save();playing=false;tcMissed=missed;showOnly('timeOverlay');renderTimeCard();renderHUD();$('tcGo').focus();
}

const G={active:false,id:null,opts:{},phase:'',timers:[],raf:0,key:null,render:null,cleanup:null,lastStars:1};
function gClear(){G.timers.forEach(t=>{clearTimeout(t);clearInterval(t);});G.timers=[];cancelAnimationFrame(G.raf);G.key=null;if(G.cleanup){try{G.cleanup()}catch(e){}}G.cleanup=null;}
function gLater(fn,ms){const t=setTimeout(fn,ms);G.timers.push(t);return t;}
function gEvery(fn,ms){const t=setInterval(fn,ms);G.timers.push(t);return t;}
const gStat=t=>$('gStat').textContent=t,gTime=t=>{$('gTime').textContent=t;$('gTime').hidden=!t;};
function openGame(id,opts){
 gClear();stopSpeech();keys.clear();target=null;autoAct=null;
 G.active=true;G.id=id;G.opts=opts||{};G.phase='intro';G.result=null;
 $('gameOverlay').hidden=false;G.render=renderGameShell;renderGameShell();
}
function renderGameShell(){
 const gt=GT[G.id];$('gTitle').textContent=T(gt.t);
 if(G.phase==='intro'){
  gStat(U('best')+' '+(S&&S.hi[G.id]!=null?S.hi[G.id]:'—'));gTime('');
  const a=$('gArea');a.className='garea';a.innerHTML='<div class="gintro"><h2>'+esc(T(gt.t))+'</h2><p>'+esc(T(gt.how))+'</p></div>';
  $('gFoot').innerHTML='<button class="btn" id="gStart">'+esc(U('gameStart'))+'</button>';$('gStart').onclick=()=>{sfx.click();G.phase='play';$('gFoot').innerHTML='';GAMES[G.id].start($('gArea'));};$('gStart').focus();
 }else if(G.phase==='end')showGameResult();
}
function gEnd(score,label,stars){
 gClear();G.phase='end';G.lastStars=stars;
 if(S){S.hi[G.id]=Math.max(S.hi[G.id]||0,score);}
 let rew='';const o=G.opts;
 if(o.inEvent){rew='';}
 else if(o.training){if(S&&!S.tools[o.training]){S.tools[o.training]=true;rew=U('toolGot',{'%T':U('tools.'+o.training)});sfx.tool();toast(U('newTool')+'<br>'+(o.training==='breath'?'🌬️':o.training==='talk'?'💬':'🧠'));}changeMood(stars*2);}
 else if(S){const key=G.id+S.block;if(!S.played[key]){S.played[key]=1;const m=(o.calm?3:2)*stars;changeMood(m);rew=U('reward',{'%#':String(m)});if(o.partner){changeBond(o.partner,5);curNPC=o.partner;rew+=U('rewardBond',{'%N':nameOf(o.partner)});curNPC=null;}}else rew=U('rewardNone');}
 G.result={score,label,stars,rew};save();renderHUD();
 (stars>=2?sfx.win:sfx.click)();showGameResult();
}
function showGameResult(){
 const r=G.result,o=G.opts;
 const a=$('gArea');let ov=a.querySelector('.gintro');if(!ov){ov=document.createElement('div');ov.className='gintro';a.append(ov);}
 ov.innerHTML='<h2>'+esc(U('score'))+': '+esc(r.label)+'</h2><div class="stars3">'+[1,2,3].map(n=>'<span'+(r.stars>=n?' class="on"':'')+'>★</span>').join('')+'</div><p>'+esc(r.rew)+'</p>';
 $('gFoot').innerHTML=(o.inEvent||o.training?'':'<button class="btn ghost" id="gAgain">'+esc(U('gameAgain'))+'</button>')+'<button class="btn" id="gDone">'+esc(U('gameDone'))+'</button>';
 if($('gAgain'))$('gAgain').onclick=()=>{sfx.click();G.phase='play';$('gFoot').innerHTML='';GAMES[G.id].start($('gArea'));};
 $('gDone').onclick=closeGame;$('gDone').focus();
}
function closeGame(){
 gClear();$('gameOverlay').hidden=true;G.active=false;const o=G.opts,st=G.lastStars||1,ended=G.phase==='end';G.phase='';G.render=null;
 if(o.inEvent&&o.onEnd)o.onEnd(ended?st:1);
 if(S&&!o.inEvent)renderArea(true);
}
